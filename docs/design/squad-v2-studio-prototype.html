<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyCodex Squad V2 — 原生分屏工作台与内嵌里程碑卡交互原型</title>
  <style>
    /* ==========================================================================
       1. 设计系统 Tokens（高信噪比 · 冷静石墨暗色 / 暖石膏亮色 · 零紫光俗套）
       ========================================================================== */
    :root,
    [data-theme="light"] {
      color-scheme: light;
      --bg-app: #ECEAE5;
      --bg-sidebar: #F6F5F2;
      --bg-stage: #FFFFFF;
      --bg-studio: #F9F9F8;
      --bg-elevated: #FFFFFF;
      --bg-subtle: #F2F1ED;
      --bg-hover: #EAE8E2;
      --bg-active: #E2DFD7;
      --bg-code: #F4F5F7;

      --border-hairline: #E4E2DC;
      --border-default: #D5D2CA;
      --border-strong: #B8B4AA;

      --text-primary: #17191C;
      --text-secondary: #4A4F57;
      --text-muted: #6E747E;
      --text-on-accent: #FFFFFF;

      /* 精密工程钢蓝主色（克制、专业、高对比度） */
      --accent-solid: #1B5488;
      --accent-hover: #14426C;
      --accent-text: #184D7D;
      --accent-soft: #EBF2F9;
      --accent-border: #B7D1EA;
      --focus-ring: rgba(27, 84, 136, 0.38);

      /* 语义状态三层 Token */
      --status-running-dot: #1D74B8;
      --status-running-text: #165B91;
      --status-running-bg: #E9F3FB;
      --status-running-border: #BBD8F2;

      --status-settled-dot: #1E7E4E;
      --status-settled-text: #16653E;
      --status-settled-bg: #EAF6F0;
      --status-settled-border: #B7E1CA;

      --status-attention-dot: #C06C14;
      --status-attention-text: #8D4D08;
      --status-attention-bg: #FDF4E7;
      --status-attention-border: #ECC996;

      --status-danger-dot: #C43B31;
      --status-danger-text: #9C2B23;
      --status-danger-bg: #FCEEEB;
      --status-danger-border: #EEBDB8;

      --status-idle-dot: #8A9099;
      --status-idle-text: #5B616B;
      --status-idle-bg: #EFECE6;

      /* Diff 专用色 */
      --diff-add-bg: #E8F6EE;
      --diff-add-ln: #D2EEDE;
      --diff-add-text: #145936;
      --diff-del-bg: #FCECE9;
      --diff-del-ln: #F7D7D2;
      --diff-del-text: #94261E;

      --shadow-card: 0 1px 3px rgba(20, 24, 30, 0.05), 0 1px 2px rgba(20, 24, 30, 0.03);
      --shadow-float: 0 8px 24px rgba(20, 24, 30, 0.10);
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg-app: #0D0F12;
      --bg-sidebar: #12151A;
      --bg-stage: #161920;
      --bg-studio: #14171D;
      --bg-elevated: #1B1F27;
      --bg-subtle: #20252F;
      --bg-hover: #262C37;
      --bg-active: #2D3442;
      --bg-code: #111419;

      --border-hairline: #252A34;
      --border-default: #303744;
      --border-strong: #434C5E;

      --text-primary: #ECEFF4;
      --text-secondary: #ABB3C2;
      --text-muted: #7E8796;
      --text-on-accent: #0C1117;

      --accent-solid: #63A9E5;
      --accent-hover: #7DB9EC;
      --accent-text: #7CB8EC;
      --accent-soft: rgba(99, 169, 229, 0.13);
      --accent-border: rgba(99, 169, 229, 0.34);
      --focus-ring: rgba(99, 169, 229, 0.45);

      --status-running-dot: #54A6EB;
      --status-running-text: #7EC0F5;
      --status-running-bg: rgba(84, 166, 235, 0.14);
      --status-running-border: rgba(84, 166, 235, 0.34);

      --status-settled-dot: #47B881;
      --status-settled-text: #73D1A1;
      --status-settled-bg: rgba(71, 184, 129, 0.14);
      --status-settled-border: rgba(71, 184, 129, 0.34);

      --status-attention-dot: #E5993E;
      --status-attention-text: #F2B56B;
      --status-attention-bg: rgba(229, 153, 62, 0.15);
      --status-attention-border: rgba(229, 153, 62, 0.38);

      --status-danger-dot: #E5645A;
      --status-danger-text: #F28B82;
      --status-danger-bg: rgba(229, 100, 90, 0.15);
      --status-danger-border: rgba(229, 100, 90, 0.36);

      --status-idle-dot: #6C7584;
      --status-idle-text: #949DAB;
      --status-idle-bg: rgba(108, 117, 132, 0.16);

      --diff-add-bg: rgba(56, 168, 109, 0.15);
      --diff-add-ln: rgba(56, 168, 109, 0.24);
      --diff-add-text: #85DCA9;
      --diff-del-bg: rgba(224, 93, 83, 0.15);
      --diff-del-ln: rgba(224, 93, 83, 0.24);
      --diff-del-text: #F49B94;

      --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.28);
      --shadow-float: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    :root {
      --font-sans: "SF Pro Text", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: "SF Mono", "JetBrains Mono", "Menlo", "Monaco", "Consolas", monospace;
      --studio-width: 480px;
      --radius-xs: 4px;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 10px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-app);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea, select {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 1px;
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    /* ==========================================================================
       2. 顶部原型演练控制台（Scenario & Viewport Harness）
       ========================================================================== */
    .proto-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-width: 0;
    }

    .proto-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-hairline);
      flex-shrink: 0;
      flex-wrap: wrap;
      min-width: 0;
    }

    .proto-toolbar-left,
    .proto-toolbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .proto-brand {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text-secondary);
      padding-right: 6px;
      border-right: 1px solid var(--border-hairline);
      white-space: nowrap;
    }

    .proto-brand-mark {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: var(--accent-solid);
      display: inline-block;
    }

    .scenario-strip {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .scenario-btn {
      height: 24px;
      padding: 0 8px;
      border-radius: var(--radius-xs);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease;
    }

    .scenario-btn:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .scenario-btn.is-active {
      background: var(--accent-soft);
      color: var(--accent-text);
      border-color: var(--accent-border);
      font-weight: 600;
    }

    .ctrl-pill-group {
      display: inline-flex;
      align-items: center;
      background: var(--bg-subtle);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-xs);
      padding: 1px;
      gap: 1px;
    }

    .ctrl-pill {
      height: 21px;
      padding: 0 7px;
      border: none;
      border-radius: 3px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 11px;
      white-space: nowrap;
    }

    .ctrl-pill:hover {
      color: var(--text-primary);
    }

    .ctrl-pill.is-active {
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    .icon-btn {
      height: 24px;
      padding: 0 8px;
      border-radius: var(--radius-xs);
      border: 1px solid var(--border-hairline);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .icon-btn:hover {
      border-color: var(--border-default);
      color: var(--text-primary);
      background: var(--bg-hover);
    }

    /* 窄屏/单栏模式下切换三大面板的紧凑导航条 */
    .compact-pane-switcher {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 5px 10px;
      background: var(--bg-studio);
      border-bottom: 1px solid var(--border-hairline);
      flex-shrink: 0;
    }

    .compact-pane-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }

    .compact-pane-tab {
      flex: 1;
      min-width: 0;
      height: 25px;
      padding: 0 6px;
      border-radius: var(--radius-xs);
      border: 1px solid var(--border-hairline);
      background: var(--bg-subtle);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .compact-pane-tab.is-active {
      background: var(--bg-elevated);
      border-color: var(--accent-border);
      color: var(--accent-text);
      font-weight: 600;
    }

    /* ==========================================================================
       3. Codex 原生三栏桌面容器（Sidebar + Main Stage + Resizable Split Studio）
       ========================================================================== */
    .codex-workspace {
      flex: 1;
      min-height: 0;
      min-width: 0;
      display: flex;
      width: 100%;
      overflow: hidden;
      background: var(--bg-stage);
    }

    /* 左侧原生会话栏 */
    .native-sidebar {
      width: 218px;
      min-width: 218px;
      max-width: 218px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-hairline);
      display: flex;
      flex-direction: column;
      min-height: 0;
      user-select: none;
    }

    .sidebar-top {
      padding: 10px 10px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sidebar-section-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 8px 6px 4px;
    }

    .thread-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      min-height: 28px;
      padding: 4px 7px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      text-align: left;
      width: 100%;
      min-width: 0;
    }

    .thread-row:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .thread-row.is-selected {
      background: var(--bg-active);
      color: var(--text-primary);
      font-weight: 500;
    }

    .thread-row-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .thread-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .sidebar-micro-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 5px;
      border-radius: 999px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-hairline);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 10px;
      line-height: 14px;
      flex-shrink: 0;
    }

    .hidden-slots-toggle {
      margin-top: 2px;
      padding: 3px 7px 3px 18px;
      border: none;
      border-radius: var(--radius-xs);
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      text-align: left;
    }

    .hidden-slots-toggle:hover {
      background: var(--bg-hover);
      color: var(--text-secondary);
    }

    .slot-subrow {
      margin-left: 12px;
      padding: 3px 6px;
      border-left: 1px solid var(--border-default);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      font-size: 11px;
      color: var(--text-secondary);
      border-radius: 0 var(--radius-xs) var(--radius-xs) 0;
    }

    .slot-subrow:hover {
      background: var(--bg-hover);
    }

    .slot-subrow.is-selected {
      background: var(--accent-soft);
      color: var(--accent-text);
      border-left-color: var(--accent-solid);
    }

    .mini-promote-btn {
      border: 1px solid var(--border-hairline);
      background: var(--bg-elevated);
      color: var(--text-muted);
      border-radius: 3px;
      padding: 0 4px;
      height: 18px;
      font-size: 10px;
      flex-shrink: 0;
    }

    .mini-promote-btn:hover {
      color: var(--text-primary);
      border-color: var(--border-default);
    }

    /* ==========================================================================
       4. 中间主对话舞台（Main Conversation Stage & Inline Milestone Cards）
       ========================================================================== */
    .main-stage {
      flex: 1;
      min-width: 300px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg-stage);
      position: relative;
    }

    /* 切入子会话深聊时的置顶轻量返回锚点 */
    .return-anchor-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 14px;
      background: var(--accent-soft);
      border-bottom: 1px solid var(--accent-border);
      color: var(--accent-text);
      font-size: 12px;
      flex-shrink: 0;
    }

    .return-anchor-btn {
      height: 24px;
      padding: 0 10px;
      border-radius: var(--radius-xs);
      border: 1px solid var(--accent-border);
      background: var(--bg-elevated);
      color: var(--accent-text);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .return-anchor-btn:hover {
      background: var(--accent-solid);
      color: var(--text-on-accent);
      border-color: var(--accent-solid);
    }

    .stage-header {
      height: 40px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      min-width: 0;
    }

    .stage-header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stage-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .stage-stream {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg-user {
      align-self: flex-end;
      max-width: 85%;
      padding: 9px 13px;
      border-radius: 12px 12px 3px 12px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-hairline);
      color: var(--text-primary);
      font-size: 13px;
    }

    .msg-assistant {
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: var(--text-primary);
      font-size: 13px;
      line-height: 1.55;
    }

    .msg-speaker {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 单行异步 Squad Notice（防注意力涣散，绝不刷过程日志） */
    .squad-notice-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-subtle);
      border-left: 3px solid var(--accent-solid);
      font-size: 12px;
      color: var(--text-secondary);
    }

    .squad-notice-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      color: var(--accent-text);
      flex-shrink: 0;
    }

    /* 主对话内嵌里程碑卡（Blueprint Card & Convergence Card） */
    .milestone-card {
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      background: var(--bg-elevated);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    .milestone-card-head {
      padding: 11px 14px;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border-hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .milestone-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-text);
    }

    .milestone-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .milestone-title {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .milestone-intent {
      margin: 0;
      font-size: 12.5px;
      color: var(--text-secondary);
    }

    .mc-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mc-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mc-criteria-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .mc-criterion {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      font-size: 12px;
      padding: 4px 7px;
      border-radius: var(--radius-xs);
      background: var(--bg-studio);
      border: 1px solid var(--border-hairline);
    }

    .mc-role-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
      gap: 8px;
    }

    .mc-role-chip {
      padding: 7px 9px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-hairline);
      background: var(--bg-studio);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .mc-option-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mc-option {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-hairline);
      background: var(--bg-studio);
      cursor: pointer;
      text-align: left;
      width: 100%;
    }

    .mc-option:hover {
      border-color: var(--border-strong);
    }

    .mc-option.is-selected {
      border-color: var(--accent-solid);
      background: var(--accent-soft);
    }

    .assumptions-callout {
      padding: 9px 11px;
      border-radius: var(--radius-sm);
      background: var(--status-attention-bg);
      border: 1px solid var(--status-attention-border);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .assumptions-callout-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--status-attention-text);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .assumptions-list {
      margin: 0;
      padding-left: 16px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 12px;
      color: var(--text-primary);
    }

    .milestone-foot {
      padding: 10px 14px;
      background: var(--bg-subtle);
      border-top: 1px solid var(--border-hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dual-channel-hint {
      font-size: 11px;
      color: var(--text-muted);
    }

    .btn-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      height: 28px;
      padding: 0 11px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-default);
      background: var(--bg-elevated);
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--bg-hover);
      border-color: var(--border-strong);
    }

    .btn-primary {
      background: var(--accent-solid);
      border-color: var(--accent-solid);
      color: var(--text-on-accent);
      font-weight: 600;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn-sm {
      height: 23px;
      padding: 0 8px;
      font-size: 11px;
      border-radius: var(--radius-xs);
    }

    /* 原生底部 Composer（验证自然语言双通道拍板） */
    .stage-composer-wrap {
      padding: 10px 20px 14px;
      border-top: 1px solid var(--border-hairline);
      background: var(--bg-stage);
      flex-shrink: 0;
    }

    .stage-composer {
      max-width: 720px;
      margin: 0 auto;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      background: var(--bg-elevated);
      padding: 7px 9px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stage-composer input {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      font-size: 12.5px;
      color: var(--text-primary);
      outline: none;
    }

    /* ==========================================================================
       5. 可拖拽分隔条 + 右侧原生分屏 Squad Studio（400px ~ 680px 零溢出）
       ========================================================================== */
    .split-resizer {
      width: 5px;
      cursor: col-resize;
      background: var(--border-hairline);
      position: relative;
      flex-shrink: 0;
      transition: background-color 120ms ease;
    }

    .split-resizer:hover,
    .split-resizer.is-dragging {
      background: var(--accent-solid);
    }

    .squad-studio-pane {
      width: var(--studio-width);
      min-width: 400px;
      max-width: 680px;
      height: 100%;
      background: var(--bg-studio);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow-x: hidden;
    }

    .studio-tabbar {
      height: 40px;
      padding: 0 12px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      min-width: 0;
    }

    .studio-tab-title {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      font-size: 12px;
      font-weight: 600;
    }

    .studio-tab-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 19px;
      padding: 0 6px;
      border-radius: var(--radius-xs);
      font-size: 10.5px;
      font-weight: 500;
      border: 1px solid var(--border-hairline);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .badge-stateful {
      color: var(--accent-text);
      background: var(--accent-soft);
      border-color: var(--accent-border);
    }

    .badge-clean {
      border-style: dashed;
      border-color: var(--border-strong);
      color: var(--text-secondary);
      background: transparent;
    }

    .badge-settled {
      color: var(--status-settled-text);
      background: var(--status-settled-bg);
      border-color: var(--status-settled-border);
    }

    .badge-attention {
      color: var(--status-attention-text);
      background: var(--status-attention-bg);
      border-color: var(--status-attention-border);
    }

    .badge-danger {
      color: var(--status-danger-text);
      background: var(--status-danger-bg);
      border-color: var(--status-danger-border);
    }

    /* 置顶拦截槽 Needs You：无阻塞时严格 0px 隐藏！ */
    .needs-you-slot {
      background: var(--status-attention-bg);
      border-bottom: 1px solid var(--status-attention-border);
      padding: 9px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex-shrink: 0;
    }

    .needs-you-slot[hidden] {
      display: none !important;
      height: 0 !important;
      padding: 0 !important;
      border: none !important;
    }

    .needs-you-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--status-attention-text);
    }

    .needs-you-item {
      background: var(--bg-elevated);
      border: 1px solid var(--status-attention-border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .studio-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 上半区 STATE 画布 */
    .studio-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      padding: 10px 11px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      min-width: 0;
    }

    .studio-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .studio-section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .criteria-compact-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .criterion-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
      padding: 4px 6px;
      border-radius: var(--radius-xs);
      background: var(--bg-studio);
      min-width: 0;
    }

    .criterion-row.is-done {
      color: var(--text-secondary);
    }

    .criterion-check {
      font-family: var(--font-mono);
      font-weight: 700;
      flex-shrink: 0;
      width: 14px;
    }

    .criterion-check.is-done {
      color: var(--status-settled-dot);
    }

    .contracts-drawer {
      border-top: 1px solid var(--border-hairline);
      padding-top: 7px;
    }

    .contracts-toggle {
      width: 100%;
      background: transparent;
      border: none;
      padding: 2px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .contracts-list {
      margin: 6px 0 0;
      padding-left: 15px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    /* 纵向缩进角色拓扑树（Role Topology Tree） */
    .topology-tree {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .topo-node {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 5px 7px;
      border-radius: var(--radius-xs);
      border: 1px solid transparent;
      background: var(--bg-studio);
      cursor: pointer;
      min-width: 0;
      text-align: left;
      width: 100%;
    }

    .topo-node:hover {
      border-color: var(--border-default);
      background: var(--bg-hover);
    }

    .topo-node.is-selected {
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }

    .topo-indent-1 {
      padding-left: 18px;
      position: relative;
    }

    .topo-indent-1::before {
      content: "├─";
      position: absolute;
      left: 5px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 10px;
    }

    .topo-indent-2 {
      padding-left: 30px;
      position: relative;
    }

    .topo-indent-2::before {
      content: "└─";
      position: absolute;
      left: 16px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 10px;
    }

    .topo-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .topo-right {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    /* 状态圆点（仅 active 执行低频呼吸，reduced-motion 降级） */
    .status-dot {
      width: 12px;
      height: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
    }

    .status-dot::after {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--status-idle-dot);
    }

    .status-dot[data-state="active"]::after {
      background: var(--status-running-dot);
    }

    .status-dot[data-state="active"]::before {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--status-running-dot);
      animation: squadPulse 2000ms cubic-bezier(0.25, 0.8, 0.25, 1) infinite;
    }

    .status-dot[data-state="quiescent"]::after {
      background: var(--status-settled-dot);
    }

    .status-dot[data-state="waiting"]::after,
    .status-dot[data-state="escalate"]::after {
      background: var(--status-attention-dot);
    }

    .status-dot[data-state="failed"]::after {
      background: var(--status-danger-dot);
    }

    @keyframes squadPulse {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(2.3); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .status-dot[data-state="active"]::before {
        animation: none;
        transform: scale(1.75);
        opacity: 0.28;
      }
    }

    /* 下半区角色抽检卡与原地窥屏（Role Inspection & In-Place Peek） */
    .role-card-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .role-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      overflow: hidden;
      min-width: 0;
    }

    .role-card.is-expanded {
      border-color: var(--accent-border);
      box-shadow: var(--shadow-card);
    }

    .role-card.has-attention {
      border-color: var(--status-attention-border);
    }

    .role-card-summary {
      width: 100%;
      padding: 9px 11px;
      background: transparent;
      border: none;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .role-card-summary:hover {
      background: var(--bg-hover);
    }

    .role-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      min-width: 0;
    }

    .role-ident {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .role-handle {
      font-weight: 600;
      font-size: 12.5px;
      color: var(--text-primary);
    }

    .role-metrics {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* 物理改动比例条（3 files · +64 -18 · ✓ 边界内） */
    .delta-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      color: var(--text-secondary);
      padding-top: 2px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .delta-bar-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .delta-meter {
      width: 44px;
      height: 5px;
      border-radius: 999px;
      background: var(--bg-subtle);
      overflow: hidden;
      display: inline-flex;
      flex-shrink: 0;
    }

    .delta-meter-add {
      background: var(--status-settled-dot);
      height: 100%;
    }

    .delta-meter-del {
      background: var(--status-danger-dot);
      height: 100%;
    }

    .text-add { color: var(--status-settled-text); }
    .text-del { color: var(--status-danger-text); }
    .text-warn { color: var(--status-attention-text); }

    /* 角色卡原地展开面板 */
    .role-peek-panel {
      border-top: 1px solid var(--border-hairline);
      background: var(--bg-studio);
      padding: 10px 11px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      min-width: 0;
    }

    .peek-tabs {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .peek-tab-list {
      display: inline-flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .peek-tab {
      height: 23px;
      padding: 0 8px;
      border-radius: var(--radius-xs);
      border: 1px solid var(--border-hairline);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-size: 11px;
    }

    .peek-tab.is-active {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent-text);
      font-weight: 600;
    }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .file-row-btn {
      width: 100%;
      padding: 6px 8px;
      border-radius: var(--radius-xs);
      border: 1px solid var(--border-hairline);
      background: var(--bg-elevated);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
      font-size: 11.5px;
      min-width: 0;
    }

    .file-row-btn:hover {
      border-color: var(--accent-border);
      background: var(--bg-hover);
    }

    .file-path {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      flex: 1;
    }

    /* 分屏内原生风格代码 Diff 视图 */
    .native-diff-box {
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm);
      background: var(--bg-code);
      overflow: hidden;
      min-width: 0;
    }

    .native-diff-head {
      padding: 6px 9px;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border-hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      min-width: 0;
    }

    .diff-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.5;
      table-layout: fixed;
    }

    .diff-table td {
      padding: 1px 6px;
      vertical-align: top;
    }

    .diff-ln {
      width: 34px;
      text-align: right;
      color: var(--text-muted);
      user-select: none;
      border-right: 1px solid var(--border-hairline);
    }

    .diff-code {
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .diff-row-add .diff-ln { background: var(--diff-add-ln); color: var(--diff-add-text); }
    .diff-row-add .diff-code { background: var(--diff-add-bg); color: var(--diff-add-text); }
    .diff-row-del .diff-ln { background: var(--diff-del-ln); color: var(--diff-del-text); }
    .diff-row-del .diff-code { background: var(--diff-del-bg); color: var(--diff-del-text); }

    .brief-pre {
      margin: 0;
      padding: 9px 10px;
      border-radius: var(--radius-xs);
      background: var(--bg-code);
      border: 1px solid var(--border-hairline);
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text-secondary);
    }

    /* JSON 契约快照抽屉 */
    .contract-drawer-modal {
      position: fixed;
      inset: 0;
      background: rgba(10, 12, 16, 0.48);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }

    .contract-drawer-modal[hidden] {
      display: none !important;
    }

    .contract-modal-card {
      width: min(760px, 100%);
      max-height: 82vh;
      background: var(--bg-elevated);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-float);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .contract-modal-pre {
      margin: 0;
      padding: 12px 14px;
      overflow: auto;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.48;
      background: var(--bg-code);
      color: var(--text-primary);
    }

    /* ==========================================================================
       6. 1:1 分屏单栏模式 & 400px~680px 窄视口自适应（零横向溢出保障）
       ========================================================================== */
    [data-layout="split-only"] .compact-pane-switcher {
      display: flex;
    }

    [data-layout="split-only"] .split-resizer {
      display: none;
    }

    [data-layout="split-only"] .native-sidebar,
    [data-layout="split-only"] .main-stage,
    [data-layout="split-only"] .squad-studio-pane {
      display: none;
      width: 100% !important;
      min-width: 0 !important;
      max-width: none !important;
      border-right: none;
    }

    [data-layout="split-only"][data-active-pane="studio"] .squad-studio-pane {
      display: flex;
    }

    [data-layout="split-only"][data-active-pane="stage"] .main-stage {
      display: flex;
    }

    [data-layout="split-only"][data-active-pane="sidebar"] .native-sidebar {
      display: flex;
    }

    @media (max-width: 960px) {
      .compact-pane-switcher {
        display: flex;
      }
      .split-resizer,
      .width-preset-controls {
        display: none !important;
      }
      .native-sidebar,
      .main-stage,
      .squad-studio-pane {
        display: none;
        width: 100% !important;
        min-width: 0 !important;
        max-width: none !important;
        border-right: none;
      }
      [data-active-pane="studio"] .squad-studio-pane {
        display: flex;
      }
      [data-active-pane="stage"] .main-stage {
        display: flex;
      }
      [data-active-pane="sidebar"] .native-sidebar {
        display: flex;
      }
      .stage-scroll {
        padding: 12px;
      }
      .stage-composer-wrap {
        padding: 8px 12px 10px;
      }
    }
  </style>
</head>
<body data-layout="desktop" data-active-pane="studio">
  <div class="proto-shell" id="app">
    <!-- 顶部原型演练控制台 -->
    <header class="proto-toolbar" aria-label="原型场景与视口控制栏">
      <div class="proto-toolbar-left">
        <span class="proto-brand">
          <span class="proto-brand-mark"></span>
          <span>Squad V2 Prototype</span>
        </span>
        <div class="scenario-strip" id="scenario-strip" role="tablist" aria-label="全流程生命周期场景"></div>
      </div>
      <div class="proto-toolbar-right">
        <div class="ctrl-pill-group width-preset-controls" aria-label="右侧分屏宽度预设">
          <button type="button" class="ctrl-pill mono" data-studio-width="400">400px</button>
          <button type="button" class="ctrl-pill mono is-active" data-studio-width="480">480px</button>
          <button type="button" class="ctrl-pill mono" data-studio-width="640">640px</button>
        </div>
        <div class="ctrl-pill-group" aria-label="布局视图切换">
          <button type="button" class="ctrl-pill is-active" data-layout-btn="desktop">三栏桌面</button>
          <button type="button" class="ctrl-pill" data-layout-btn="split-only">1:1 分屏</button>
        </div>
        <button type="button" class="icon-btn mono" id="btn-inspect-json" title="查看当前对齐 squad-v2-contracts.mts 的实时 SquadStudioSnapshot JSON">
          <span>Snapshot JSON</span>
        </button>
        <button type="button" class="icon-btn" id="btn-theme-toggle" aria-label="切换亮暗主题">
          <span id="theme-label">切换暗色</span>
        </button>
      </div>
    </header>

    <!-- 窄屏 / 1:1 分屏模式下的三面板快速切换器 -->
    <nav class="compact-pane-switcher" aria-label="紧凑模式面板切换">
      <div class="compact-pane-tabs">
        <button type="button" class="compact-pane-tab is-active" data-pane-tab="studio" id="tab-btn-studio">Squad Studio 分屏</button>
        <button type="button" class="compact-pane-tab" data-pane-tab="stage" id="tab-btn-stage">主对话舞台</button>

            { role: "assistant", speaker: "Orchestrator · 主会话", text: "三路分支已干净合入 `squad/sq-v2-034`，全新拉起的 `@clean-verifier`（零对话历史，仅输入 4 条判据与完整 Git Diff）已完成独立验证。我已把各角色的关键假设（Assumptions & Trade-offs）提炼在下方阶段交付卡中，请审阅拍板：" }
          ],
          notices: [
            "✓ @clean-verifier 空白终审完成：4/4 判据通过，0 越界文件，门禁退出码 0。"
          ],
          childChatLog: []
        };
      }

      // ========================================================================
      // 3. 交互状态机与 DOM 安全转义工具
      // ========================================================================
      const store = {
        scenarioId: "blueprint",
        theme: "light",
        layout: "desktop",
        activePane: "studio",
        studioWidth: 480,
        sidebarSlotsOpen: false,
        contractsOpen: false,
        peekTabBySlot: {},
        selectedDiffFileBySlot: {},
        session: createScenarioData("blueprint")
      };

      function esc(val) {
        return String(val == null ? "" : val)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatDuration(ms) {
        if (ms == null) return "—";
        const totalSec = Math.max(1, Math.round(ms / 1000));
        const m = String(Math.floor(totalSec / 60)).padStart(2, "0");
        const s = String(totalSec % 60).padStart(2, "0");
        return m + ":" + s;
      }

      function activityLabel(slot) {
        if (slot.result && slot.result.status === "escalate") return "请求升级";
        if (slot.result && slot.result.status === "blocked") return "受阻";
        switch (slot.activity) {
          case "active": return "运行中";
          case "quiescent": return slot.result && slot.result.status === "done" ? "已静止·完工" : "已静止";
          case "waiting": return "等待输入";
          case "failed": return "异常";
          case "closed": return "已收束";
          default: return "待派发";
        }
      }

      function dotState(slot) {
        if (slot.result && (slot.result.status === "escalate" || slot.result.status === "blocked")) {
          return "escalate";
        }
        return slot.activity;
      }

      function computeAggregateBadge(snapshot) {
        let attn = snapshot.needsYou.length;
        let running = 0;
        let done = 0;
        snapshot.slots.forEach(function (s) {
          if (s.activity === "active") running += 1;
          else if (s.activity === "quiescent" && s.result && s.result.status === "done") done += 1;
        });
        const parts = [];
        if (attn > 0) parts.push('<span class="text-warn">⚠' + attn + '</span>');
        if (running > 0) parts.push('<span style="color:var(--status-running-text)">⟳' + running + '</span>');
        if (done > 0) parts.push('<span class="text-add">✓' + done + '</span>');
        if (parts.length === 0) parts.push('<span>○' + snapshot.slots.length + '</span>');
        return parts.slice(0, 2).join('<span>·</span>');
      }

      function switchScenario(id) {
        store.scenarioId = id;
        store.session = createScenarioData(id);
        store.peekTabBySlot = {};
        store.selectedDiffFileBySlot = {};
        store.sidebarSlotsOpen = id === "stepin";
        const meta = SCENARIO_META.find(function (m) { return m.id === id; });
        if (meta && (store.layout === "split-only" || window.innerWidth <= 960)) {
          store.activePane = meta.defaultPane;
        }
        renderAll();
      }

      // 双通道共用拍板动作（校验 expectedRevision，原位推进 STATE）
      function resolveActiveGate(expectedRevision, customNote) {
        const snap = store.session.snapshot;
        const gate = snap.state.activeGate;
        if (!gate || gate.status !== "open") return;
        if (expectedRevision !== snap.state.revision) return;

        const chosenId = store.session.selectedOptionId || gate.recommendedOptionId;
        const chosenOpt = (gate.options || []).find(function (o) { return o.id === chosenId; });
        const summaryText = customNote || (chosenOpt ? chosenOpt.label : "已批准");

        gate.status = "approved";
        gate.resolutionText = summaryText;
        gate.resolvedAt = Date.now();
        snap.state.revision += 1;
        snap.state.updatedAt = Date.now();
        snap.needsYou = [];
        snap.state.openBlockers = [];

        if (gate.kind === "blueprint") {
          snap.slots.forEach(function (s) {
            if (s.dependsOn.length === 0) {
              s.activity = "active";
              s.elapsedMs = 12000;
              s.contextPercent = 11;
            }
          });
          snap.state.tasks.forEach(function (t) {
            if (t.dependsOn.length === 0) t.status = "running";
          });
          snap.state.activeGate = null;
          store.session.notices.push("已按 rev." + snap.state.revision + " 拍板「" + summaryText + "」，3 个独立 worktree 槽位已进入静默并行（右侧 Needs You 自动归零隐藏）。");
        } else if (gate.kind === "decision") {
          const kSlot = snap.slots.find(function (s) { return s.slotId === "role-kernel"; });
          if (kSlot) {
            if (chosenId === "opt-keep-contract" && kSlot.delta) {
              kSlot.delta.outsideTouches = [];
              kSlot.delta.changed = kSlot.delta.changed.filter(function (f) {
                return f.path !== "gateway/spine/squad-v2-contracts.mts";
              });
            }
            kSlot.result = {
              status: "done",
              summary: "已执行主会话裁决（" + summaryText + "），静止探针与 Notice 管道全部验证通过。",
              assumptions: ["嵌套 subagent 静止计数已在探针内部闭环消化，公共契约保持 100% 稳定。"],
              body: "单测 32/32 通过。",
              criteriaMet: ["C2"],
              reportedAt: Date.now(),
              autoSynthesized: false
            };
            kSlot.activity = "quiescent";
          }
          const kTask = snap.state.tasks.find(function (t) { return t.slotId === "role-kernel"; });
          if (kTask) kTask.status = "done";
          const c2 = snap.state.criteria.find(function (c) { return c.id === "C2"; });
          if (c2) { c2.verifiedBy = "@role-kernel"; c2.verifiedAt = Date.now(); }
          snap.state.activeGate = null;
          store.session.notices.push("契约裁决已生效（rev." + snap.state.revision + "）：@role-kernel 越界风险解除并完成 C2 收口。");
        } else if (gate.kind === "convergence") {
          if (chosenId === "opt-hold-review") {
            store.session.expandedSlotId = "role-protocol";
            store.peekTabBySlot["role-protocol"] = "files";
            store.activePane = "studio";
            renderAll();
            return;
          }
          snap.status = "closed";
          snap.slots.forEach(function (s) { s.activity = "closed"; });
          snap.state.activeGate = null;
          store.session.notices.push("✓ 集成分支 squad/sq-v2-034 已按 rev." + snap.state.revision + " 合入目标分支，小队已收束（全部会话历史完整保留）。");
        }

        snap.events.push({
          seq: snap.events.length + 1,
          at: Date.now(),
          kind: "gate_resolved",
          slotId: null,
          summary: "Gate 裁决完成 (rev." + snap.state.revision + "): " + summaryText
        });
        renderAll();
      }

      function stepIntoSlot(slotId) {
        const slot = store.session.snapshot.slots.find(function (s) { return s.slotId === slotId; });
        if (!slot || slot.continuity !== "stateful") return;
        store.session.activeThreadView = slotId;
        if (store.session.childChatLog.length === 0) {
          store.session.childChatLog = [
            {
              role: "assistant",
              speaker: slot.handle + " · stateful (" + slot.model + ")",
              text: "当前正专注于授权边界 `" + (slot.touches.join(", ") || "shared") + "`。你可以直接对我补充领域细节或审美偏好，完成后点击上方「★ 返回主会话」，结果将单行回流给主会话。"
            }
          ];
        }
        store.activePane = "stage";
        renderAll();
      }

      function returnToAnchorThread() {
        const prevSlotId = store.session.activeThreadView;
        if (prevSlotId === "anchor") return;
        const slot = store.session.snapshot.slots.find(function (s) { return s.slotId === prevSlotId; });
        store.session.activeThreadView = "anchor";
        const handle = slot ? slot.handle : prevSlotId;
        const noticeText = "人类已直接切入持久槽位 " + handle + " 完成细节对齐并返回，无公共契约冲突（STATE 保持 rev." + store.session.snapshot.state.revision + "）。";
        if (store.session.notices[store.session.notices.length - 1] !== noticeText) {
          store.session.notices.push(noticeText);
        }
        renderAll();
      }

      function togglePromoteSlot(slotId) {
        const slot = store.session.snapshot.slots.find(function (s) { return s.slotId === slotId; });
        if (!slot) return;
        slot.sidebarHidden = !slot.sidebarHidden;
        renderAll();
      }

      // ========================================================================
      // 4. 三大区域渲染器（Sidebar / Main Stage / Right Split Squad Studio）

      function renderToolbar() {
        document.documentElement.setAttribute("data-theme", store.theme);

        if (themeLabel) {
          themeLabel.textContent = store.theme === "light" ? "切换暗色" : "切换亮色";
        }

        const strip = document.getElementById("scenario-strip");
        strip.innerHTML = SCENARIO_META.map(function (sc) {
          const activeCls = sc.id === store.scenarioId ? " is-active" : "";

        document.getElementById("native-sidebar").innerHTML =

            '<span>CODEX THREADS</span>' +
            '<span class="mono">Local</span>' +
          '</div>' +
          '<div class="sidebar-list">' +
            '<div class="sidebar-section-label">Pinned</div>' +

              '<span class="thread-row-left">' +
                '<span class="proto-brand-mark"></span>' +
                '<span class="thread-title">设计并组建 MyCodex 工作台小队</span>' +
              '</span>' +
              '<span class="sidebar-micro-badge" title="小队实时聚合状态">' + computeAggregateBadge(snap) + '</span>' +
            '</button>' +
            promotedHtml +
            (hiddenSlots.length > 0
              ? '<button type="button" class="hidden-slots-toggle" id="btn-toggle-hidden-slots">' +
                  '<span>' + (store.sidebarSlotsOpen ? "▾" : "▸") + ' 已折叠临时子槽位 (' + hiddenSlots.length + ')</span>' +
                  '<span class="mono" style="font-size:10px">默认静默</span>' +
                '</button>' +
                hiddenListHtml
              : '') +
            '<div class="sidebar-section-label" style="margin-top:10px">Recent</div>' +
            '<div class="thread-row" style="opacity:0.72;cursor:default">' +
              '<span class="thread-row-left"><span class="thread-title">修复 App Server 唤醒延迟</span></span>' +
              '<span class="mono" style="font-size:10px;color:var(--text-muted)">2h</span>' +
            '</div>' +
            '<div class="thread-row" style="opacity:0.72;cursor:default">' +
              '<span class="thread-row-left"><span class="thread-title">整理 ADR-0033 实战复盘笔记</span></span>' +
              '<span class="mono" style="font-size:10px;color:var(--text-muted)">1d</span>' +
            '</div>' +
          '</div>';
      }

      function renderMilestoneCard(snap) {

          }).join("");

          const optionsHtml = (gate.options || []).map(function (opt) {

                  '<div class="mc-criteria-list">' +
                    snap.state.criteria.map(function (c) {
                      return '<div class="mc-criterion"><span class="mono" style="font-weight:600;color:var(--accent-text)">' + esc(c.id) + '</span><span>' + esc(c.text) + '</span></div>';
                    }).join("") +
                  '</div>' +
                '</div>' +
                '<div class="mc-section">' +
                  '<div class="mc-label"><span>角色切分与异构模型配置 (stateful 持久专家 + clean 空白终审)</span></div>' +

                '<div class="mc-criterion" style="background:var(--bg-subtle)">' +

                '</div>' +

                      '<span><strong>' + esc(opt.label) + '</strong> — <span style="color:var(--text-secondary)">' + esc(opt.summary) + '</span></span>' +

              '<span class="dual-channel-hint">右侧分屏置顶 Needs You 槽可一键处理</span>' +

            return (
              '<div class="msg-assistant">' +
                '<div class="msg-speaker"><span>' + esc(m.speaker) + '</span></div>' +
                '<div>' + esc(m.text) + '</div>' +

            '<div class="return-anchor-bar" role="region" aria-label="子会话返回主会话锚点">' +

                '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">正在直连持久专家 <strong>' + esc(slot.handle) + '</strong>（仅聚焦 ' + esc(slot.branch || "shared") + '，已隔离全队流水账）</span>' +

              '<button type="button" class="return-anchor-btn" id="btn-return-anchor">★ 返回主会话</button>' +

            '<div class="stage-header">' +
              '<div class="stage-header-title">' +
                '<span class="status-dot" data-state="' + esc(dotState(slot)) + '"></span>' +
                '<span class="mono">' + esc(slot.handle) + '</span>' +
                '<span class="badge mono">' + esc(slot.model) + '</span>' +
                '<span class="badge mono">' + esc(slot.workspace) + '</span>' +

              '<span class="mono" style="font-size:11px;color:var(--text-muted)">ctx ' + (slot.contextPercent || 18) + '%</span>' +

              '<div>' + esc(m.text) + '</div>' +
            '</div>'

        const noticesHtml = store.session.notices.map(function (n) {
          return (
            '<div class="squad-notice-pill">' +
              '<span style="display:flex;align-items:center;gap:8px;min-width:0">' +

          );

          ? "输入自然语言拍板（如：批准推荐方案开跑）或继续正常对话，共用 expectedRevision=" + snap.state.revision + "…"
          : "主会话输入框随时可用：小队在后台静默运行，不会刷屏打断你的当前思考…";

          '<div class="stage-header">' +

            '</div>' +
            '<div style="display:flex;align-items:center;gap:6px">' +
              '<span class="mono" style="font-size:11px;color:var(--text-muted)">STATE rev.' + snap.state.revision + '</span>' +

      function renderDiffBox(slotId, filePath) {
        const diffEntry = FILE_DIFF_LIBRARY[filePath] || {
          title: filePath,
          sha: "078531c..HEAD",
          lines: [
            { oldLn: 1, newLn: 1, kind: "ctx", text: "// Scoped workspace modification within declared touches" },
            { oldLn: null, newLn: 2, kind: "add", text: "export const verifiedByCleanSlot = true;" }
          ]
        };
        const rows = diffEntry.lines.map(function (ln) {
          const rowCls = ln.kind === "add" ? "diff-row-add" : ln.kind === "del" ? "diff-row-del" : "";
          const prefix = ln.kind === "add" ? "+" : ln.kind === "del" ? "-" : " ";
          return (
            '<tr class="' + rowCls + '">' +
              '<td class="diff-ln">' + (ln.oldLn == null ? "" : ln.oldLn) + '</td>' +
              '<td class="diff-ln">' + (ln.newLn == null ? "" : ln.newLn) + '</td>' +
              '<td class="diff-code">' + esc(prefix + " " + ln.text) + '</td>' +
            '</tr>'
          );
        }).join("");

        return (
          '<div class="native-diff-box">' +
            '<div class="native-diff-head">' +
              '<span class="mono" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600">' + esc(diffEntry.title) + '</span>' +
              '<div style="display:flex;align-items:center;gap:6px;flex-shrink:0">' +
                '<span class="mono" style="color:var(--text-muted)">' + esc(diffEntry.sha) + '</span>' +
                '<button type="button" class="btn btn-sm" data-close-diff="' + esc(slotId) + '">← 文件列表</button>' +
              '</div>' +
            '</div>' +
            '<table class="diff-table" aria-label="代码变更预览"><tbody>' + rows + '</tbody></table>' +
          '</div>'
        );
      }

      function renderRolePeek(slot) {
        const defaultTab = (slot.delta && slot.delta.outsideTouches.length > 0) ? "files" : "result";
        const activeTab = store.peekTabBySlot[slot.slotId] || defaultTab;
        const selectedDiff = store.selectedDiffFileBySlot[slot.slotId] || null;
        const filesCount = slot.delta ? slot.delta.changed.length : 0;

        let bodyHtml = "";
        if (activeTab === "result") {
          if (slot.result) {
            const statusBadgeCls = slot.result.status === "done"
              ? "badge-settled"
              : slot.result.status === "escalate" ? "badge-attention" : "badge-danger";
            bodyHtml =
              '<div style="display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap">' +
                '<span style="font-size:12px;font-weight:600">' + esc(slot.result.summary) + '</span>' +
                '<span class="badge ' + statusBadgeCls + ' mono">status: ' + esc(slot.result.status) + (slot.result.autoSynthesized ? " · auto" : "") + '</span>' +
              '</div>' +
              (slot.result.assumptions && slot.result.assumptions.length > 0
                ? '<div class="assumptions-callout">' +
                    '<div class="assumptions-callout-title"><span>关键假设与取舍 (Assumptions & Trade-offs)</span></div>' +
                    '<ul class="assumptions-list">' +
                      slot.result.assumptions.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join("") +
                    '</ul>' +
                  '</div>'
                : '') +
              '<div style="font-size:11.5px;color:var(--text-secondary)">' + esc(slot.result.body) + '</div>';
          } else {
            bodyHtml =
              '<div style="font-size:11.5px;color:var(--text-secondary);padding:4px 2px">' +
                (slot.activity === "active"
                  ? '正在独立工作树内静默执行，尚未写入 `.mycodex/result.md`。末条物理探针：`' + esc(slot.lastOutputSnippet || "running...") + '`'
                  : '当前槽位处于 `' + esc(slot.activity) + '` 阶段，等待前置依赖完成派发。') +
              '</div>';
          }
        } else if (activeTab === "files") {
          if (selectedDiff) {
            bodyHtml = renderDiffBox(slot.slotId, selectedDiff);
          } else if (slot.delta && slot.delta.changed.length > 0) {
            const outsideSet = new Set(slot.delta.outsideTouches || []);
            bodyHtml =
              '<div class="file-list">' +
                slot.delta.changed.map(function (f) {
                  const isOutside = outsideSet.has(f.path);
                  return (
                    '<button type="button" class="file-row-btn" data-open-diff-slot="' + esc(slot.slotId) + '" data-open-diff-path="' + esc(f.path) + '">' +
                      '<span class="mono" style="font-weight:600;width:14px;color:var(--accent-text)">' + esc(f.status) + '</span>' +
                      '<span class="file-path mono">' + esc(f.path) + '</span>' +
                      (isOutside ? '<span class="badge badge-danger mono">越出 touches</span>' : '') +
                      '<span class="mono" style="flex-shrink:0"><span class="text-add">+' + f.add + '</span> <span class="text-del">−' + f.del + '</span> · Diff ▸</span>' +
                    '</button>'
                  );
                }).join("") +
              '</div>';
          } else {
            bodyHtml = '<div style="font-size:11.5px;color:var(--text-muted)">无工作树文件增删（只读终审或尚未产生提交）。</div>';
          }
        } else {
          bodyHtml =
            '<pre class="brief-pre">' + esc(slot.briefMarkdown || "# 尚未生成角色裁剪简报") + '</pre>' +
            '<div class="mono" style="font-size:10.5px;color:var(--text-muted)">授权写边界 touches: ' +
              esc(slot.touches.length ? slot.touches.join(", ") : "[] (只读验证)") +
            '</div>';
        }

        return (
          '<div class="role-peek-panel">' +
            '<div class="peek-tabs">' +
              '<div class="peek-tab-list">' +
                '<button type="button" class="peek-tab' + (activeTab === "result" ? " is-active" : "") + '" data-peek-slot="' + esc(slot.slotId) + '" data-peek-tab="result">Result & 假设</button>' +
                '<button type="button" class="peek-tab' + (activeTab === "files" ? " is-active" : "") + '" data-peek-slot="' + esc(slot.slotId) + '" data-peek-tab="files">改动文件 (' + filesCount + ')</button>' +
                '<button type="button" class="peek-tab' + (activeTab === "brief" ? " is-active" : "") + '" data-peek-slot="' + esc(slot.slotId) + '" data-peek-tab="brief">裁剪 Brief</button>' +
              '</div>' +
              (slot.continuity === "stateful"
                ? '<button type="button" class="btn btn-sm" data-step-slot="' + esc(slot.slotId) + '">切入子会话深聊 ↗</button>'
                : '<span class="badge badge-clean mono" title="空白验证者禁止多轮私聊污染上下文">零历史隔离槽</span>') +
            '</div>' +
            bodyHtml +
          '</div>'
        );
      }

      function renderStudio() {
        const snap = store.session.snapshot;
        const studioEl = document.getElementById("squad-studio");
        const doneCriteriaCount = snap.state.criteria.filter(function (c) { return Boolean(c.verifiedBy); }).length;
        const gate = snap.state.activeGate;

        const hasNeeds = snap.needsYou.length > 0;
        const needsHtml =
          '<section class="needs-you-slot" id="needs-you-slot"' + (hasNeeds ? '' : ' hidden') + ' aria-label="Needs You 置顶拦截槽">' +
            (hasNeeds
              ? '<div class="needs-you-head">' +
                  '<span>⚠ NEEDS YOU · 需你拍板 (' + snap.needsYou.length + ')</span>' +
                  '<span class="mono">STATE rev.' + snap.state.revision + '</span>' +
                '</div>' +
                snap.needsYou.map(function (item) {
                  const jumpBtnLabel = item.kind === "slot_escalated" ? "原地查看越界 Diff" : "原地抽检代码 Diff";
                  return (
                    '<div class="needs-you-item">' +
                      '<div style="font-size:12px;font-weight:600;color:var(--text-primary)">' + esc(item.title) + '</div>' +
                      '<div style="font-size:11.5px;color:var(--text-secondary)">' + esc(item.detail) + '</div>' +
