                            '</button>'
                          : '') +
                      '</div>' +
                    '</div>'
                  );
                }).join("")
              : '') +
          '</section>';

        const topoHtml =
          '<div class="topology-tree" role="tree" aria-label="纵向缩进角色拓扑树">' +
            '<div class="topo-node" style="cursor:default;background:var(--bg-subtle)">' +
              '<span class="topo-left">' +
                '<span class="proto-brand-mark"></span>' +
                '<strong style="font-size:11.5px">Orchestrator · 主会话 (单写者 STATE.md)</strong>' +
              '</span>' +
              '<span class="badge mono">' + esc(snap.integrationBranch || "main") + '</span>' +
            '</div>' +
            snap.slots.map(function (s) {
              const indentCls = s.dependsOn.length > 0 ? " topo-indent-2" : " topo-indent-1";
              const selCls = store.session.expandedSlotId === s.slotId ? " is-selected" : "";
              return (
                '<button type="button" class="topo-node' + indentCls + selCls + '" data-select-slot="' + esc(s.slotId) + '">' +
                  '<span class="topo-left">' +
                    '<span class="status-dot" data-state="' + esc(dotState(s)) + '"></span>' +
                    '<span class="mono" style="font-weight:600;font-size:11.5px">' + esc(s.handle) + '</span>' +
                    (s.dependsOn.length > 0
                      ? '<span class="mono" style="font-size:10px;color:var(--text-muted)">after 3 slots</span>'
                      : '') +
                  '</span>' +
                  '<span class="topo-right">' +
                    '<span class="badge ' + (s.continuity === "stateful" ? "badge-stateful" : "badge-clean") + ' mono">' + esc(s.continuity) + '</span>' +
                    '<span class="badge mono">' + esc(s.workspace) + '</span>' +
                  '</span>' +
                '</button>'
              );
            }).join("") +
          '</div>';

        const roleCardsHtml = snap.slots.map(function (s) {
          const expanded = store.session.expandedSlotId === s.slotId;
          const hasAttn = (s.result && s.result.status === "escalate") || (s.delta && s.delta.outsideTouches.length > 0);
          let files = 0, add = 0, del = 0, outside = 0;
          if (s.delta) {
            files = s.delta.changed.length;
            outside = s.delta.outsideTouches.length;
            s.delta.changed.forEach(function (f) { add += f.add; del += f.del; });
          }
          const totalLines = Math.max(1, add + del);
          const addPct = Math.round((add / totalLines) * 100);
          const delPct = 100 - addPct;

          const deltaSummaryHtml = s.delta && files > 0
            ? '<div class="delta-bar-group">' +
                '<span class="delta-meter" aria-hidden="true">' +
                  '<span class="delta-meter-add" style="width:' + addPct + '%"></span>' +
                  '<span class="delta-meter-del" style="width:' + delPct + '%"></span>' +
                '</span>' +
                '<span class="mono">' + files + ' files · <span class="text-add">+' + add + '</span> <span class="text-del">−' + del + '</span></span>' +
              '</div>' +
              (outside > 0
                ? '<span class="badge badge-danger mono">✗ ' + outside + ' 越界</span>'
                : '<span class="mono text-add" style="font-weight:600">✓ 边界内</span>')
            : '<span class="mono" style="color:var(--text-muted)">' +
                (s.continuity === "clean" ? "只读独立终审槽 · 零历史污染" : "等待产生工作树提交…") +
              '</span>' +
              '<span class="mono" style="color:var(--text-muted)">' + esc(s.branch || "shared") + '</span>';

          return (
            '<article class="role-card' + (expanded ? " is-expanded" : "") + (hasAttn ? " has-attention" : "") + '" id="card-' + esc(s.slotId) + '">' +
              '<button type="button" class="role-card-summary" data-select-slot="' + esc(s.slotId) + '" aria-expanded="' + expanded + '">' +
                '<div class="role-row-top">' +
                  '<div class="role-ident">' +
                    '<span class="status-dot" data-state="' + esc(dotState(s)) + '"></span>' +
                    '<span class="role-handle mono">' + esc(s.handle) + '</span>' +
                    '<span class="badge mono">' + esc(s.model) + '</span>' +
                    '<span class="badge ' + (s.continuity === "stateful" ? "badge-stateful" : "badge-clean") + ' mono">' + esc(s.continuity) + '</span>' +
                  '</div>' +
                  '<div class="role-metrics mono">' +
                    '<span>' + esc(activityLabel(s)) + '</span>' +
                    '<span>·</span>' +
                    '<span>' + formatDuration(s.elapsedMs) + '</span>' +
                  '</div>' +
                '</div>' +
                '<div class="delta-strip">' + deltaSummaryHtml + '</div>' +
              '</button>' +
              (expanded ? renderRolePeek(s) : '') +
            '</article>'
          );
        }).join("");

        studioEl.innerHTML =
          '<div class="studio-tabbar">' +
            '<div class="studio-tab-title">' +
              '<span class="proto-brand-mark"></span>' +
              '<span>Squad Studio</span>' +
              '<span class="mono" style="font-size:11px;color:var(--text-muted)">' + esc(snap.squadId) + '</span>' +
            '</div>' +
            '<div class="studio-tab-meta">' +
              '<span class="badge mono">rev.' + snap.state.revision + '</span>' +
              '<span class="badge mono" id="studio-width-readout">' + ((window.innerWidth <= 960 || store.layout === "split-only") ? window.innerWidth : store.studioWidth) + 'px</span>' +
            '</div>' +
          '</div>' +
          needsHtml +
          '<div class="studio-scroll">' +
            '<section class="studio-card" aria-label="上半区 STATE 画布">' +
              '<div class="studio-section-head">' +
                '<span class="studio-section-title">STATE 画布 · 判据与拓扑</span>' +
                '<span class="badge ' + (doneCriteriaCount === snap.state.criteria.length ? "badge-settled" : "") + ' mono">✓ ' + doneCriteriaCount + '/' + snap.state.criteria.length + ' 判据</span>' +
              '</div>' +
              '<div class="criteria-compact-list">' +
                snap.state.criteria.map(function (c) {
                  const done = Boolean(c.verifiedBy);
                  return (
                    '<div class="criterion-row' + (done ? " is-done" : "") + '">' +
                      '<span style="display:flex;gap:6px;min-width:0">' +
                        '<span class="criterion-check' + (done ? " is-done" : "") + '">' + (done ? "✓" : "·") + '</span>' +
                        '<span><strong class="mono">' + esc(c.id) + '</strong> ' + esc(c.text) + '</span>' +
                      '</span>' +
                      (done ? '<span class="mono" style="font-size:10px;color:var(--status-settled-text);flex-shrink:0">' + esc(c.verifiedBy) + '</span>' : '') +
                    '</div>'
                  );
                }).join("") +
              '</div>' +
              topoHtml +
              '<div class="contracts-drawer">' +
                '<button type="button" class="contracts-toggle" id="btn-toggle-contracts" aria-expanded="' + store.contractsOpen + '">' +
                  '<span>' + (store.contractsOpen ? "▾" : "▸") + ' 公共契约与铁律 (' + (snap.state.contracts.length + snap.state.invariants.length) + ' 条)</span>' +
                  '<span class="mono" style="font-size:10px;color:var(--text-muted)">按需展开</span>' +
                '</button>' +
                (store.contractsOpen
                  ? '<ul class="contracts-list">' +
                      snap.state.invariants.map(function (inv) { return '<li><strong>[铁律]</strong> ' + esc(inv) + '</li>'; }).join("") +
                      snap.state.contracts.map(function (ct) { return '<li>' + esc(ct) + '</li>'; }).join("") +
                    '</ul>'
                  : '') +
              '</div>' +
            '</section>' +
            '<div class="studio-section-head" style="padding:0 2px">' +
              '<span class="studio-section-title">角色抽检与原地窥屏 (' + snap.slots.length + ')</span>' +
              '<span class="mono" style="font-size:10.5px;color:var(--text-muted)">点击卡片展开假设与代码 Diff</span>' +
            '</div>' +
            '<div class="role-card-list">' + roleCardsHtml + '</div>' +
          '</div>';
      }

      function renderAll() {
        renderToolbar();
        renderSidebar();
        renderMainStage();
        renderStudio();
      }

      // ========================================================================
      // 5. 全局事件委托与 400px~680px 可拖拽原生分屏逻辑
      // ========================================================================
      document.addEventListener("click", function (ev) {
        const target = ev.target.closest("button, [data-sidebar-thread], [data-step-slot]");
        if (!target) return;

        if (target.hasAttribute("data-scenario")) {
          switchScenario(target.getAttribute("data-scenario"));
          return;
        }
        if (target.id === "btn-theme-toggle") {
          store.theme = store.theme === "light" ? "dark" : "light";
          renderToolbar();
          return;
        }
        if (target.hasAttribute("data-layout-btn")) {
          store.layout = target.getAttribute("data-layout-btn");
          renderToolbar();
          return;
        }
        if (target.hasAttribute("data-studio-width")) {
          store.studioWidth = Number(target.getAttribute("data-studio-width"));
          store.layout = "desktop";
          renderAll();
          return;
        }
        if (target.hasAttribute("data-pane-tab")) {
          store.activePane = target.getAttribute("data-pane-tab");
          renderToolbar();
          return;
        }
        if (target.id === "btn-inspect-json") {
          const modal = document.getElementById("contract-modal");
          document.getElementById("contract-modal-pre").textContent = JSON.stringify(store.session.snapshot, null, 2);
          modal.hidden = false;
          return;
        }
        if (target.id === "btn-close-modal") {
          document.getElementById("contract-modal").hidden = true;
          return;
        }
        if (target.hasAttribute("data-promote-slot")) {
          ev.stopPropagation();
          togglePromoteSlot(target.getAttribute("data-promote-slot"));
          return;
        }
        if (target.id === "btn-anchor-thread" || target.id === "btn-return-anchor") {
          returnToAnchorThread();
          return;
        }
        if (target.id === "btn-toggle-hidden-slots") {
          store.sidebarSlotsOpen = !store.sidebarSlotsOpen;
          renderSidebar();
          return;
        }
        if (target.hasAttribute("data-sidebar-thread")) {
          stepIntoSlot(target.getAttribute("data-sidebar-thread"));
          return;
        }
        if (target.hasAttribute("data-step-slot")) {
          ev.stopPropagation();
          stepIntoSlot(target.getAttribute("data-step-slot"));
          return;
        }
        if (target.hasAttribute("data-gate-option")) {
          store.session.selectedOptionId = target.getAttribute("data-gate-option");
          renderMainStage();
          return;
        }
        if (target.hasAttribute("data-approve-gate")) {
          resolveActiveGate(Number(target.getAttribute("data-approve-gate")));
          return;
        }
        if (target.hasAttribute("data-focus-studio")) {
          store.activePane = "studio";
          renderToolbar();
          return;
        }
        if (target.id === "btn-review-split-diff") {
          store.session.expandedSlotId = "role-protocol";
          store.peekTabBySlot["role-protocol"] = "files";
          store.selectedDiffFileBySlot["role-protocol"] = "bridge/request-sanitize.mjs";
          store.activePane = "studio";
          renderAll();
          return;
        }
        if (target.id === "btn-toggle-contracts") {
          store.contractsOpen = !store.contractsOpen;
          renderStudio();
          return;
        }
        if (target.hasAttribute("data-jump-slot")) {
          const sid = target.getAttribute("data-jump-slot");
          const jkind = target.getAttribute("data-jump-kind");
          store.session.expandedSlotId = sid;
          store.peekTabBySlot[sid] = "files";
          store.selectedDiffFileBySlot[sid] = jkind === "slot_escalated"
            ? "gateway/spine/squad-v2-contracts.mts"
            : "bridge/request-sanitize.mjs";
          renderStudio();
          return;
        }
        if (target.hasAttribute("data-select-slot")) {
          const sid = target.getAttribute("data-select-slot");
          store.session.expandedSlotId = store.session.expandedSlotId === sid ? null : sid;
          renderStudio();
          return;
        }
        if (target.hasAttribute("data-peek-tab")) {
          const sid = target.getAttribute("data-peek-slot");
          store.peekTabBySlot[sid] = target.getAttribute("data-peek-tab");
          store.selectedDiffFileBySlot[sid] = null;
          renderStudio();
          return;
        }
        if (target.hasAttribute("data-open-diff-path")) {
          const sid = target.getAttribute("data-open-diff-slot");
          store.selectedDiffFileBySlot[sid] = target.getAttribute("data-open-diff-path");
          renderStudio();
          return;
        }
        if (target.hasAttribute("data-close-diff")) {
          const sid = target.getAttribute("data-close-diff");
          store.selectedDiffFileBySlot[sid] = null;
          renderStudio();
          return;
        }
      });

      document.addEventListener("submit", function (ev) {
        if (ev.target && ev.target.id === "stage-composer-form") {
          ev.preventDefault();
          const input = document.getElementById("stage-composer-input");
          const val = (input.value || "").trim();
          if (!val) return;
          input.value = "";

          if (store.session.activeThreadView !== "anchor") {
            const slot = store.session.snapshot.slots.find(function (s) {
              return s.slotId === store.session.activeThreadView;
            });
            store.session.childChatLog.push({ role: "user", text: val });
            store.session.childChatLog.push({
              role: "assistant",
              speaker: (slot ? slot.handle : "@specialist") + " · stateful",
              text: "收到微调要求：「" + val + "」。已在当前独立工作树内更新实现，不触碰公共契约；随时可点顶部「★ 返回主会话」合流。"
            });
            renderMainStage();
            return;
          }

          store.session.anchorMessages.push({ role: "user", text: val });
          const snap = store.session.snapshot;
          if (snap.state.activeGate && snap.state.activeGate.status === "open") {
            resolveActiveGate(snap.state.revision, val);
          } else {
            store.session.anchorMessages.push({
              role: "assistant",
              speaker: "Orchestrator · 主会话",
              text: "已记录：「" + val + "」。后台槽位仍在静默推进，无契约冲突时不中断你的主线对话。"
            });
            renderMainStage();
          }
        }
      });

      (function initSplitResizer() {
        const resizer = document.getElementById("split-resizer");
        let dragging = false;

        resizer.addEventListener("pointerdown", function (ev) {
          dragging = true;
          resizer.classList.add("is-dragging");
          resizer.setPointerCapture(ev.pointerId);
        });

        resizer.addEventListener("pointermove", function (ev) {
          if (!dragging) return;
          const nextWidth = Math.min(680, Math.max(400, Math.round(window.innerWidth - ev.clientX)));
          store.studioWidth = nextWidth;
          document.documentElement.style.setProperty("--studio-width", nextWidth + "px");
          const readout = document.getElementById("studio-width-readout");
          if (readout) readout.textContent = nextWidth + "px";
        });

        function stopDrag() {
          if (!dragging) return;
          dragging = false;
          resizer.classList.remove("is-dragging");
          renderToolbar();
        }
        resizer.addEventListener("pointerup", stopDrag);
        resizer.addEventListener("pointercancel", stopDrag);
      })();

      renderAll();
      window.addEventListener("resize", function () {
        const readout = document.getElementById("studio-width-readout");
        const studioEl = document.getElementById("squad-studio");
        if (readout && studioEl && studioEl.clientWidth > 0) {
          readout.textContent = studioEl.clientWidth + "px";
        }
      });
    })();
  </script>
</body>
</html>
