model = "gpt-5.6-sol"
model_provider = "layout-test"
check_for_update_on_startup = false
ephemeral = true
disable_paste_burst = true

[model_providers.layout-test]
name = "Isolated TUI test"
base_url = "http://127.0.0.1:1"
wire_api = "responses"
requires_openai_auth = false
request_max_retries = 0
stream_max_retries = 0

[tui]
alternate_screen = "never"
status_line = ["model-with-reasoning", "context-used", "cache-hit", "context-window-size", "used-tokens"]

[notice]
hide_full_access_warning = true
hide_rate_limit_model_nudge = true

[analytics]
enabled = false

# The interaction fixture must not start unrelated marketplace network downloads.
# This setting is confined to the disposable test profile.
[features]
plugins = false
