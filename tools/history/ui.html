<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local session history</title>
<style>
:root { color-scheme: light dark; font: 14px system-ui,sans-serif; background: Canvas; color: CanvasText; }
body { margin: 0 auto; max-width: 1200px; padding: 24px; }
h1 { margin: 0 0 8px; font-size: 24px; }
p { line-height: 1.5; }
.muted { opacity: .75; }
.bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin: 18px 0; }
label { display: grid; gap: 5px; }
input,select,button { font: inherit; padding: 8px 10px; border: 1px solid GrayText; border-radius: 6px; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
table { width: 100%; border-collapse: collapse; }
th,td { text-align: left; border-bottom: 1px solid GrayText; padding: 10px 8px; vertical-align: top; }
td.title { max-width: 420px; overflow-wrap: anywhere; }
small { display: block; opacity: .7; overflow-wrap: anywhere; }
#status { white-space: pre-wrap; padding: 12px; border-radius: 6px; background: color-mix(in srgb, CanvasText 8%, Canvas); }
#status[data-error=true] { color: #c84040; }
dialog { width: min(760px,90vw); border: 1px solid GrayText; border-radius: 12px; padding: 24px; }
dialog::backdrop { background: #0008; }
.preview { max-height: 45vh; overflow: auto; }
.danger { border-color: #c84040; }
</style>
</head>
<body>
<h1>Session history</h1>
<p class="muted">GitHub Copilot and ccodex local history. Previews do not change sessions. Running sessions and unsupported ownership states remain protected.</p>
<div class="bar">
<label>Product<select id="product"><option value="all">All available products</option><option value="copilot">GitHub Copilot</option><option value="ccodex">ccodex</option></select></label>
<label>Search<input id="query" placeholder="Title, UUID or directory"></label>
<label>Working directory<input id="cwd" placeholder="Exact directory (optional)"></label>
<label>Archived<select id="archived"><option value="">Any</option><option value="false">Not archived</option><option value="true">Archived</option></select></label>
<label>Modified from<input id="after" type="date"></label>
<label>Modified before<input id="before" type="date"></label>
<button id="refresh">Refresh</button>
</div>
<div class="bar">
<label>Operation<select id="operation"><option value="delete">Delete permanently</option><option value="archive">Archive</option><option value="unarchive">Restore archive</option><option value="rename">Rename</option></select></label>
<label>Name template<input id="name" placeholder="{title} - {index}" disabled></label>
<button id="preview" disabled>Preview selected sessions</button>
<span id="selected">0 selected</span>
</div>
<p id="status" role="status" aria-live="polite">Loading local history...</p>
<table aria-label="Local session history">
<thead><tr><th><input id="all" type="checkbox" aria-label="Select eligible visible sessions"></th><th>Session</th><th>Product</th><th>Modified</th><th>Ownership</th></tr></thead>
<tbody id="rows"></tbody>
</table>
<div class="bar"><button id="previous" disabled>Previous page</button><button id="next" disabled>Next page</button><span id="page"></span></div>
<dialog id="review">
<h2 id="review-title">Confirm history operation</h2>
<p id="warning"></p>
<div class="preview"><table><thead><tr><th>Session</th><th>Result of preview</th></tr></thead><tbody id="review-rows"></tbody></table></div>
<div class="bar"><button id="cancel">Cancel</button><button id="apply">Apply this exact preview</button></div>
</dialog>
<script>
"use strict";
const token = location.hash.slice(1);
history.replaceState(null, "", location.pathname);
const element = id => document.getElementById(id);
const selection = new Map();
let cursor = 0, nextCursor = null, pageRows = [], plan = null, busy = false;
const status = (message,error=false) => {
  element("status").textContent = message;
  element("status").dataset.error = String(error);
};
async function api(route, options={}) {
  const response = await fetch(route, { ...options, headers: {
    Authorization: "Bearer " + token,
    ...(options.body ? {"Content-Type":"application/json"} : {})
  }});
  const result = await response.json();
  if (!response.ok) throw new Error(result.error?.message || "Local history request failed.");
  return result;
}
function controls() {
  element("selected").textContent = selection.size + " selected";
  element("preview").disabled = busy || selection.size === 0;
  for (const id of ["refresh","product","query","cwd","archived","after","before","operation","all"]) element(id).disabled = busy;
  for (const checkbox of element("rows").querySelectorAll("input[type=checkbox]")) {
    checkbox.disabled = busy || checkbox.dataset.eligible !== "true"
      || (selection.size >= 500 && !selection.has(checkbox.dataset.key));
  }
  element("name").disabled = busy || element("operation").value !== "rename";
  element("previous").disabled = busy || cursor === 0;
  element("next").disabled = busy || nextCursor === null;
}
function cell(row,text,cls) {
  const item = document.createElement("td");
  item.textContent = text;
  if (cls) item.className = cls;
  row.append(item);
  return item;
}
async function load(reset=false) {
  if (busy) return;
  if (reset) { cursor = 0; selection.clear(); }
  busy = true; controls();
  try {
    const params = new URLSearchParams({ product:element("product").value,query:element("query").value,
      cwd:element("cwd").value,cursor:String(cursor),limit:"50" });
    for (const filter of ["archived","after","before"]) {
      if (element(filter).value) params.set(filter,element(filter).value);
    }
    const result = await api("/api/sessions?" + params);
    pageRows = result.sessions; nextCursor = result.nextCursor;
    element("rows").replaceChildren();
    for (const item of pageRows) {
      const row = document.createElement("tr");
      const column = document.createElement("td"), checkbox = document.createElement("input");
      checkbox.type = "checkbox"; checkbox.checked = selection.has(item.key);
      const supported = item.operations.includes(element("operation").value);
      checkbox.dataset.key = item.key;
      checkbox.dataset.eligible = String(item.inUse === false && !item.remote && supported);
      checkbox.disabled = checkbox.dataset.eligible !== "true";
      if (checkbox.disabled) { selection.delete(item.key); checkbox.checked = false; }
      checkbox.setAttribute("aria-label","Select " + (item.title || item.id));
      checkbox.onchange = () => { if (checkbox.checked) selection.set(item.key,item); else selection.delete(item.key); controls(); };
      column.append(checkbox); row.append(column);
      const title = cell(row,item.title || "Untitled","title");
      const detail = document.createElement("small"); detail.textContent = item.key + (item.cwd ? "\n" + item.cwd : "");
      title.append(detail);
      cell(row,item.product); cell(row,item.modifiedAt || "Unknown");
      cell(row,item.inUse === true ? "Running - protected" : item.inUse === null ? "Unknown - protected"
        : item.remote ? "Remote - protected" : !supported ? "Unsupported operation" : "Idle");
      element("rows").append(row);
    }
    element("all").checked = false;
    element("page").textContent = result.total + " sessions; page " + (Math.floor(cursor/50)+1);
    status("Choose explicit sessions, then preview an operation. Native APIs remain authoritative.");
    return true;
  } catch (error) { status(error.message,true); return false; }
  finally { busy = false; controls(); }
}
element("refresh").onclick = () => load(true);
element("previous").onclick = () => { cursor = Math.max(0,cursor-50); load(); };
element("next").onclick = () => { cursor = nextCursor; load(); };
element("operation").onchange = () => load(true);
for (const id of ["product","archived","after","before"]) element(id).onchange = () => load(true);
for (const id of ["query","cwd"]) element(id).onkeydown = event => { if (event.key === "Enter") load(true); };
element("all").onchange = () => {
  const chosen = element("all").checked;
  for (const checkbox of element("rows").querySelectorAll("input[type=checkbox]")) {
    if (checkbox.disabled) continue;
    checkbox.checked = chosen; checkbox.dispatchEvent(new Event("change"));
  }
};
element("preview").onclick = async () => {
  busy = true; controls();
  try {
    const operation = element("operation").value;
    plan = await api("/api/preview", { method:"POST",body:JSON.stringify({
      operation,keys:[...selection.keys()],
      ...(operation === "rename" ? {nameTemplate:element("name").value} : {})
    })});
    element("review-rows").replaceChildren();
    for (const entry of plan.entries) {
      const row = document.createElement("tr");
      cell(row,entry.title || entry.key);
      cell(row,entry.eligible ? (entry.name ? "Rename to: " + entry.name : "Eligible") : "Skip: " + entry.reason);
      element("review-rows").append(row);
    }
    const eligible = plan.entries.filter(entry=>entry.eligible).length;
    element("review-title").textContent = "Review " + operation + ": " + eligible + " eligible";
    element("warning").textContent = operation === "delete"
      ? "Permanent deletion removes native session history and artifacts. This cannot be undone. Confirm only the sessions shown below."
      : "Only this exact selection will be changed. Sessions are checked again for activity and changes before applying.";
    element("apply").disabled = eligible === 0;
    element("apply").className = operation === "delete" ? "danger" : "";
    element("review").showModal();
  } catch (error) { status(error.message,true); }
  finally { busy = false; controls(); }
};
element("cancel").onclick = () => { plan = null; element("review").close(); };
element("review").oncancel = event => { if (busy) event.preventDefault(); else plan = null; };
element("apply").onclick = async () => {
  if (!plan || busy) return;
  busy = true; element("apply").disabled = true; element("cancel").disabled = true; controls();
  status("Applying the confirmed preview...");
  const executingId = plan.id;
  const progressTimer = setInterval(() => {
    api("/api/progress?planId=" + encodeURIComponent(executingId)).then(progress => {
      if (busy) status("Applying: " + progress.completed + " / " + progress.total + " sessions processed.");
    }).catch(error => { if (busy) status(error.message,true); });
  },750);
  let outcome = null;
  try {
    const result = await api("/api/apply", {method:"POST",body:JSON.stringify({
      planId:plan.id,confirmation:plan.confirmation
    })});
    element("review").close(); plan = null; selection.clear();
    outcome = result;
  } catch (error) { status(error.message,true); element("review").close(); plan = null; }
  finally { clearInterval(progressTimer); busy = false; element("cancel").disabled = false; controls(); }
  if (outcome) {
    const refreshed = await load(true);
    const summary = outcome.results.map(item=>item.key + ": " + item.status
      + (item.message ? " - " + item.message : item.reason ? " - " + item.reason : "")).join("\n");
    status(summary + (refreshed ? "" : "\nThe list could not be refreshed. Use Refresh before another operation."),
      !outcome.complete || !refreshed);
  }
};
async function initialize() {
  try {
    const capabilities = await api("/api/capabilities");
    for (const option of element("product").options) {
      option.disabled = option.value !== "all" && !capabilities.products.includes(option.value);
    }
    element("product").value = capabilities.products.length === 1 ? capabilities.products[0] : "all";
    await load(true);
  } catch (error) { status(error.message,true); }
}
if (!/^[0-9a-f]{64}$/.test(token)) status("Use the local CLI/Desktop launcher to open an authorized history page.",true);
else initialize();
</script>
</body>
</html>
